spring:
  application:
    name: cab-access-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cabaccess}
    username: ${DATABASE_USER:cab_app}
    password: ${DATABASE_PASSWORD:local-app-only}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 3000
  flyway:
    user: ${MIGRATION_USER:cab_owner}
    password: ${MIGRATION_PASSWORD:local-owner-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/cab-access}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/cab-access/protocol/openid-connect/certs}
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  shutdown: graceful
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 0.1
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    version: OPENAPI_3_0
cab:
  audience: cab-api
  worker-enabled: true
  provider: ${PAYMENT_PROVIDER:razorpay}
  razorpay-base: https://api.razorpay.com/v1
  local-delivery: false
  notification-url: ${NOTIFICATION_URL:}
  notification-token: ${NOTIFICATION_TOKEN:}
  gate-url: ${GATE_URL:}
  gate-token: ${GATE_TOKEN:}
